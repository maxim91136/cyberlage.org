name: daten

# Alle 2 Stunden (GitHub kann Läufe verzögern) und auf Knopfdruck. Dazu zwei Läufe am frühen Morgen,
# damit die Tageslage in Sommer- und Winterzeit vor 07:00 deutscher Zeit im Kanal ist.
on:
  schedule:
    - cron: "17 */2 * * *"
    - cron: "50 4 * * *"
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram prüfen (ohne Senden)"
        type: boolean
        default: false
      senden:
        description: "Telegram-Testmeldung senden"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: KEV holen
        run: python pipeline/fetch_kev.py
      - name: CERT-Bund und EU-KEV holen
        run: python pipeline/fetch_extra.py
        continue-on-error: true
      - name: Ausblick holen (EPSS und NVD)
        continue-on-error: true
        run: python pipeline/fetch_ausblick.py
      - name: Radar rechnen (CVE-Liste, SANS, Trefferquote)
        run: python pipeline/fetch_radar.py
        continue-on-error: true
      - name: Uhrzeit für den Patch-Takt
        id: zeit
        run: echo "stunde=$(date -u +%H)" >> "$GITHUB_OUTPUT"
      - name: Patch-Berichte (Microsoft MSRC, Linux, Cisco; alle 6 Stunden und bei Handstart)
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["04","05","10","11","16","17","22","23"]'), steps.zeit.outputs.stunde)
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/fetch_patches.py
      - name: Prüfkalender (Fristen und Links der Handangaben)
        continue-on-error: true
        env:
          PRUEFUNG_MD: ${{ runner.temp }}/pruefung.md
        run: python pipeline/pruefen.py
      - name: Prüf-Issue öffnen oder schließen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PRUEFUNG_MD: ${{ runner.temp }}/pruefung.md
        run: |
          gh label create pruefung --color BFD4F2 --description "Prüfkalender" 2>/dev/null || true
          nr=$(gh issue list --label pruefung --state open --json number --jq '.[0].number // empty')
          if [ -s "$PRUEFUNG_MD" ]; then
            if [ -n "$nr" ]; then gh issue edit "$nr" --body-file "$PRUEFUNG_MD"
            else gh issue create --label pruefung --title "Prüfung fällig" --body-file "$PRUEFUNG_MD"; fi
          elif [ -n "$nr" ]; then
            gh issue close "$nr" --comment "Alles geprüft, nichts mehr offen."
          fi
      - name: Auswerten
        run: python pipeline/score.py
      - name: RSS-Feed schreiben
        run: python pipeline/feed.py
      - name: Text für Crawler schreiben
        run: python pipeline/prerender.py
      - name: Telegram prüfen
        if: ${{ inputs.test }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline/notify.py --diagnose
          echo "curl getMe:"; curl -sS -m 25 -w "  http=%{http_code} zeit=%{time_total}s ip=%{remote_ip}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | sed 's/"first_name":"[^"]*"//' || true
          echo "curl getMe IPv4:"; curl -4 -sS -m 25 -w "  http=%{http_code} zeit=%{time_total}s\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" -o /dev/null || true
      - name: Telegram Testmeldung
        if: ${{ inputs.senden }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/notify.py --test
      - name: Telegram melden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/notify.py
        continue-on-error: true
      - name: Änderungen speichern
        run: |
          git config user.name "cyberlage-bot"
          git config user.email "cyberlage-bot@users.noreply.github.com"
          git add data site/data site/feed.xml site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Daten aktualisiert"
            # Liegt inzwischen ein anderer Commit auf main, erst abgleichen und erneut pushen.
            # Sonst ginge der Merker "schon gemeldet" verloren und Telegram würde doppelt melden.
            for i in 1 2 3; do
              git pull --rebase -q && git push && exit 0
              echo "Push-Versuch $i fehlgeschlagen, neuer Versuch"; sleep 5
            done
            exit 1
          fi
