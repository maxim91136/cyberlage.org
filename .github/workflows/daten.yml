name: daten

# Alle 2 Stunden (GitHub kann Läufe verzögern) und auf Knopfdruck.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram prüfen (ohne Senden)"
        type: boolean
        default: false
      senden:
        description: "Telegram-Testmeldung senden"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: KEV holen
        run: python pipeline/fetch_kev.py
      - name: CERT-Bund und EU-KEV holen
        run: python pipeline/fetch_extra.py
        continue-on-error: true
      - name: Auswerten
        run: python pipeline/score.py
      - name: Telegram prüfen
        if: ${{ inputs.test }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/notify.py --diagnose
      - name: Telegram Testmeldung
        if: ${{ inputs.senden }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/notify.py --test
      - name: Telegram melden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/notify.py
        continue-on-error: true
      - name: Änderungen speichern
        run: |
          git config user.name "cyberlage-bot"
          git config user.email "cyberlage-bot@users.noreply.github.com"
          git add data site/data
          if ! git diff --cached --quiet; then
            git commit -m "Daten aktualisiert"
            git push
          fi
