name: klicktest

# Bedient die Seite im Browser und prüft feste Regeln (tests/klicktest.py):
# bei jeder Änderung an der Seite, einmal am Tag mit den frischen Daten und auf Knopfdruck.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/klicktest.py"
      - ".github/workflows/klicktest.yml"
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klicktest
  cancel-in-progress: true

jobs:
  klicken:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Browser einrichten
        run: |
          pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium
      - name: Klicktest
        run: python tests/klicktest.py
