name: quellen-test
on:
  workflow_dispatch:
    inputs:
      quellen:
        description: "Kennungen der Quellen, durch Leerzeichen getrennt (leer: alle)"
        default: "fortinet paloalto mozilla oracle"
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - name: Quellen abrufen (nichts wird gespeichert)
        env:
          QUELLEN: ${{ inputs.quellen }}
        run: python pipeline/quellen_test.py $QUELLEN
