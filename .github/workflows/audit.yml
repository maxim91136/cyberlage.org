name: audit

# Prüft die eigenen Domains von außen (Kopfzeilen, TLS, Dateien) mit audit/lauf.py.
# Das Protokoll ist öffentlich: es zeigt nur Score und Zahlen. Einzelbefunde gehen privat per Telegram an Steve.
# Läuft in derselben Gruppe wie der Datenlauf, damit beide nie zugleich ins Repo schreiben.
on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: cyberlage.org prüfen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python audit/lauf.py cyberlage.org --zusammenfassung data/audit/cyberlage.org.json --telegram
      - name: dreierlabs.com prüfen
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python audit/lauf.py dreierlabs.com --zusammenfassung data/audit/dreierlabs.com.json --telegram
      - name: Ergebnis speichern
        run: bash pipeline/speichern.sh
